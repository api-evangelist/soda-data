  /api/v1/secretsPublicKey:
    get:
      description: 'Returns the RSA public key in JWK (JSON Web Key) format, used for client-side encryption
        of secret values.


        ## Usage


        When creating or updating a secret, the secret value must be encrypted client-side before sending
        it to the API. This endpoint provides the RSA public key needed for that encryption.


        ## Encryption workflow


        1. Fetch this public key.


        2. Generate a random AES-256-GCM key (32 bytes) and initialization vector (IV, 12 bytes).


        3. Encrypt the secret value using AES-256-GCM with the generated key and IV. Base64-encode the
        ciphertext and prefix it with `encrypted_`. This becomes the `encryptedValue` field.


        4. Export the raw AES key and IV as base64 strings and concatenate them as `{base64_key}:::{base64_iv}`.
        Encrypt this string using RSA-OAEP (SHA-256) with this public key. Base64-encode the result. This
        becomes the `encryptionKey` field.


        5. Use the `encryptedValue` and `encryptionKey` in the create or update secret request.


        ## Authentication


        User authentication required: `true`


        This endpoint accepts authentication via API keys in the `Basic` authentication header, or a pre-authenticated
        token in HTTP cookie `token`. Cookie sessions extend automatically on each request.


        ## Authorization


        Users must have global role permission MANAGE_DATASOURCES_AND_AGENTS to execute this call.


        ## Tags


        `Secrets`


        ## Rate limiting


        60 requests/60 seconds'
      operationId: GET/api/v1/secretsPublicKey
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/PublicApiGetEncryptionKeyResponse'
          description: Successful response
        '401':
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
