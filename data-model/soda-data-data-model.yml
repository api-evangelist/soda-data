description: 'Entity-relationship graph of the Soda Cloud v4 API, derived from the 305 component schemas
  and the path hierarchy of the 103 harvested operations. Soda''s domain is a governance graph, not a
  flat resource list: a Datasource owns Datasets, a Dataset carries one Contract (which defines its Checks)
  plus Monitors, Columns, Attributes and Responsibilities, and running either a Contract or a Data Standard
  produces a Scan whose failures raise Incidents.'
