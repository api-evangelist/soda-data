notes:
- 'Checks are read-only-plus-delete over the API: they are authored declaratively inside contract YAML,
  so an agent that wants to add a check edits and republishes a contract.'
- A Data Standard is the one-to-many sibling of a Contract — one YAML policy fanned out across every dataset
  matching a scope.
- Three async operation ids (skeleton, generate, testConnection, onboardDatasets) are their own short-lived
  handles, distinct from a Scan id.
