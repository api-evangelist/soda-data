notes:
- Limits are stated per operation, not per plan tier; the docs do not vary them by Free/Team/Enterprise.
- 'The tightest bucket is the connectivity check itself: GET /api/v1/test-login is 10 requests/10 seconds.'
- Bulk read endpoints are the most generous at 1000 requests/60 seconds; AI/scan-triggering endpoints
  (contract generate, verify, discovery, onboarding) are the tightest at 10 requests/60 seconds.
