aid: soda-data
name: Soda
description: Soda is a data quality and data observability platform for the modern data stack. Its core
  abstraction is the data contract — a declarative YAML source of truth that defines the checks a dataset
  must pass — extended by organization-wide data standards, ML-based metric monitors for anomaly detection,
  record-level diagnostics, lineage and impact analysis, and AI-assisted contract generation (Contract
  Autopilot and Copilot). Soda ships an open-source engine (Soda Core), a Go CLI for the whole platform
  (sodacli), a 103-operation Soda Cloud v4 REST API, a webhook event surface, and a first-party MCP server
  that exposes 78 tools so agents can manage data quality directly. Soda Data Inc. is headquartered in
  Belgium.
