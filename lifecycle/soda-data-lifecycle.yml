  Versioning, release-stage and operational-lifecycle posture of the Soda platform and its v4 public API.
versioning:
  api_style: URI path — /api/v1/*
  product_generation: v4 (info.title "Soda Cloud API v4")
  note: >-
    The product generation and the URI segment disagree: the v4 API is served under /api/v1. The
    previous generation (v3) is a separate Reporting API surface, not an earlier version of the same
    paths, and there is no /api/v2 or /api/v3 in the public reference.
release_stages:
  documented: true
  url: https://docs.soda.io/reference/documentation-access-and-licensing/release-stages.md
  stages:
  - name: private preview
    definition: Early release to a limited group; not visible in Soda Cloud until design-partner feedback. Functionality, configuration and interface can change; documentation may be incomplete.
    access: request via support@soda.io
  - name: public beta
    definition: Available to every eligible organization with no request needed; free of additional cost during the beta; organizations may opt out. Functionality and documentation can still change.
    access: automatic if the feature applies to your plan
  - name: general availability
    definition: Fully released, stable, fully documented, covered by standard support, carries no stage label.
    access: all eligible organizations
  labelling: Each feature's documentation states its stage at the top of the page, and Soda Cloud shows a Preview or Beta badge.
  pricing_transition: A public beta feature that reaches GA is priced according to the organization's plan.
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  detail: >-
    Soda publishes no deprecation POLICY — no notice period, no Sunset/Deprecation response headers,
    no end-of-life calendar. What it publishes instead is per-item deprecation FACTS, scattered across
    the docs and the spec. That is enough to know something is going away and not enough to plan for it.
  observed_deprecations:
