    replaced_by: Soda Core
    evidence: https://docs.soda.io/soda-documentation/soda-v3/learning-resources/deprecated.md; both GitHub repos are archived (soda-sql archived, last push 2022-11-30)
  - item: SodaCL anomaly detection checks
    status: deprecated
    evidence: https://docs.soda.io/soda-documentation/soda-v3/sodacl-reference/anomaly-detection.md
  - item: SodaCL anomaly score checks
    status: deprecated
    evidence: https://docs.soda.io/soda-documentation/soda-v3/sodacl-reference/anomaly-score.md
  - item: Webhook payload field `outcome`
    replaced_by: evaluationStatus
    evidence: https://docs.soda.io/reference/soda-apis/webhook-api.md
  - item: Webhook payload field `diagnostics`
    replaced_by: value
    evidence: https://docs.soda.io/reference/soda-apis/webhook-api.md
  - item: Webhook payload field `agreement`
    status: deprecated, v3 concept
    evidence: https://docs.soda.io/reference/soda-apis/webhook-api.md
  - item: DatasetsContentDTO.partitionColumn
    status: 'deprecated: true in the published OpenAPI'
    evidence: openapi/_original/soda-data-cloud-api-v4-openapi.yml
  spec_level_deprecations: >-
    0 operations carry a `deprecated` flag across all 103 harvested operations; the only
